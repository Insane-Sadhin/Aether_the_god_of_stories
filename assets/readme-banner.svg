  <text x="640" y="68" text-anchor="middle" fill="#d9b85b" font-family="Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="8">MARVEL'S MASTER OF MISCHIEF</text>
  <text x="640" y="286" text-anchor="middle" fill="url(#gold)" stroke="#fff5bf" stroke-opacity=".12" font-family="Impact, Arial Narrow, sans-serif" font-size="206" letter-spacing="10">LOKI</text>
  <text x="640" y="338" text-anchor="middle" fill="#f0eadc" font-family="Georgia, serif" font-size="26" font-style="italic">God of lies. Breaker of stories.</text>
  <path d="M440 374h400" stroke="url(#gold)" stroke-opacity=".7"/><text x="640" y="407" text-anchor="middle" fill="#8fa99a" font-family="Arial, sans-serif" font-size="11" letter-spacing="5">AN INTERACTIVE MULTIVERSAL CHRONICLE</text>
