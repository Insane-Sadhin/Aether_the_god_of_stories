    <circle cx="428" cy="118" r="1"/><circle cx="518" cy="382" r="1"/><circle cx="596" cy="92" r="2"/><circle cx="704" cy="58" r="1"/>
    <circle cx="786" cy="372" r="1"/><circle cx="872" cy="98" r="2"/><circle cx="948" cy="326" r="1"/><circle cx="1050" cy="138" r="1"/>
