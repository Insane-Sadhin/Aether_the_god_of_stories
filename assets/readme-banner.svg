<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="460" viewBox="0 0 1280 460" role="img" aria-labelledby="title desc">
  <title id="title">Loki — God of Stories</title>
  <desc id="desc">A gold and green Yggdrasil glows behind the Loki title.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="70%"><stop offset="0" stop-color="#123a22"/><stop offset=".55" stop-color="#07110b"/><stop offset="1" stop-color="#020504"/></radialGradient>
    <linearGradient id="gold" x1="0" x2="1"><stop stop-color="#fff0a8"/><stop offset=".42" stop-color="#ba8121"/><stop offset=".75" stop-color="#efd36e"/><stop offset="1" stop-color="#8f5f18"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="grid" width="46" height="46" patternUnits="userSpaceOnUse"><path d="M46 0H0v46" fill="none" stroke="#72f49c" stroke-opacity=".04"/></pattern>
  </defs>
  <rect width="1280" height="460" fill="url(#bg)"/><rect width="1280" height="460" fill="url(#grid)"/>
